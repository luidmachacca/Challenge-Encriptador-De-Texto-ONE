<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge - Encriptador</title>
  <link rel="shortcut icon" type="image/png" href="./img/h1.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/stylos.css">
  <script src="./js/scritp.js" defer></script>
</head>

<body>

  <header class="encabezado">
    <img src="./img/pictograma.png" alt="Logo" class="encabezado__logo">
  </header>

  <main class="panel">

    <section class="panel__entrada">
      <label class="entrada" for="campo">
        <textarea id="campo" class="campo" placeholder="Ingrese el texto aqui" aria-label="Ingrese el texto a encriptar o desencriptar"></textarea>
      </label>

      <div class="aviso" role="note">
        <span class="aviso__icono" aria-hidden="true">!</span>
        <span class="aviso__texto">Solo letras minúsculas y sin acentos.</span>
        <div class="aviso__indicadores">
          <span class="indicador indicador--rojo" aria-hidden="true"></span>
          <span class="indicador indicador--amarillo" aria-hidden="true"></span>
          <span class="indicador indicador--verde" aria-hidden="true"></span>
        </div>
      </div>

      <div class="acciones">
        <button type="button" id="encriptar" class="boton boton--encriptar">Encriptar</button>
        <button type="button" id="desencriptar" class="boton boton--desencriptar">Desencriptar</button>
      </div>
    </section>

    <section class="panel__resultado" id="resultado">
      <p id="aviso" class="resultado__titulo">Ningún mensaje fue <br> encontrado</p>
      <p id="mensaje" class="resultado__texto">Ingresa el texto que desees encriptar o <br> desencriptar.</p>
      <button type="button" id="copiar" class="boton boton--copiar" aria-label="Copiar resultado">Copiar</button>
    </section>

  </main>

</body>

</html>
